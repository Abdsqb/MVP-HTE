<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; width: 280px; background: #131316; color: #f4f4f5; font: 13px Inter, ui-sans-serif, system-ui, sans-serif; }
      .wrap { padding: 14px; display: grid; gap: 10px; }
      .head { display: flex; align-items: center; gap: 8px; font-weight: 600; }
      .logo { width: 22px; height: 22px; border-radius: 6px; background: #6366f1; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
      label { color: #9b9ba6; font-size: 12px; }
      input { width: 100%; box-sizing: border-box; margin-top: 4px; background: #09090b; color: #f4f4f5; border: 1px solid #27272d; border-radius: 8px; padding: 7px 9px; font-size: 13px; }
      button { width: 100%; border: 0; border-radius: 8px; padding: 8px; font-size: 13px; font-weight: 600; cursor: pointer; background: #6366f1; color: white; }
      button.ghost { background: #1c1c21; color: #f4f4f5; font-weight: 500; }
      .status { font-size: 12px; }
      .ok { color: #6ee7b7; } .bad { color: #fca5a5; }
      .muted { color: #9b9ba6; font-size: 11px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head"><div class="logo">F</div>Formwise</div>
      <label>Formwise server<input id="server" placeholder="http://localhost:3000" /></label>
      <div id="status" class="status">Checking…</div>
      <button id="inject">Show the fill panel on this tab</button>
      <button id="dashboard" class="ghost">Open dashboard</button>
      <div class="muted">The panel appears by itself on localhost pages with a form. Formwise never submits forms.</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
